name: db2-vector-store-ci

on:
  push:
    branches: [main, feat/db2-vector-store]
    paths:
      - 'mem0/vector_stores/db2.py'
      - 'mem0/configs/vector_stores/db2.py'
      - 'tests/vector_stores/test_db2.py'
      - '.github/workflows/db2-vector-store-ci.yml'
  pull_request:
    paths:
      - 'mem0/vector_stores/db2.py'
      - 'mem0/configs/vector_stores/db2.py'
      - 'tests/vector_stores/test_db2.py'
      - '.github/workflows/db2-vector-store-ci.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff==0.16.0

      - name: Lint
        run: ruff check mem0/vector_stores/db2.py mem0/configs/vector_stores/db2.py

      - name: Unit tests
        run: pytest tests/vector_stores/test_db2.py -v -k "not live"

  integration-tests:
    name: Integration tests (live Db2)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        run: |
          if ! python3.11 --version &>/dev/null; then
            sudo dnf install -y python3.11 python3.11-pip python3.11-devel || \
            sudo yum install -y python3.11 python3.11-pip python3.11-devel
          fi

      - name: Install dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -e ".[test]"
          python3.11 -m pip install ibm_db python-dotenv

      - name: Live integration tests
        env:
          DB2_DATABASE: ${{ secrets.DB2_DATABASE }}
          DB2_HOST: ${{ secrets.DB2_HOST }}
          DB2_PORT: ${{ secrets.DB2_PORT }}
          DB2_USERNAME: ${{ secrets.DB2_USERNAME }}
          DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
        run: python3.11 -m pytest tests/vector_stores/test_db2.py -v -k "live"
