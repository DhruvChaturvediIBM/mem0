name: db2-vector-store-ci

on:
  push:
    branches: [main, feat/db2-vector-store-clean]
    paths:
      - 'mem0/vector_stores/db2.py'
      - 'mem0/configs/vector_stores/db2.py'
      - 'tests/vector_stores/test_db2.py'
      - '.github/workflows/db2-vector-store-ci.yml'
  pull_request:
    paths:
      - 'mem0/vector_stores/db2.py'
      - 'mem0/configs/vector_stores/db2.py'
      - 'tests/vector_stores/test_db2.py'
      - '.github/workflows/db2-vector-store-ci.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff==0.16.0

      - name: Lint
        run: ruff check mem0/vector_stores/db2.py mem0/configs/vector_stores/db2.py

      - name: Unit tests
        run: pytest tests/vector_stores/test_db2.py -v -k "not live"

  integration-tests:
    name: Integration tests (Db2 Community Edition)
    runs-on: ubuntu-latest
    services:
      db2:
        image: icr.io/db2_community/db2
        env:
          DB2INST1_PASSWORD: password
          DBNAME: BLUDB
          LICENSE: accept
        ports:
          - 25000:25000
        options: >-
          --privileged
          --health-cmd "su - db2inst1 -c 'db2 connect to BLUDB' || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install ibm_db

      - name: Live integration tests
        env:
          DB2_DATABASE: BLUDB
          DB2_HOST: localhost
          DB2_PORT: 25000
          DB2_USERNAME: db2inst1
          DB2_PASSWORD: password
        run: pytest tests/vector_stores/test_db2.py -v -k "live"
